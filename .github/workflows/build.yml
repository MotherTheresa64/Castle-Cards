name: Build Castle Cards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Blender generator syntax
        run: >-
          python -m py_compile
          ArtSource\Blender\Scripts\generate_assets.py
          ArtSource\Blender\Scripts\generate_detail_assets.py
          ArtSource\Blender\Scripts\generate_gameplay_assets.py
          ArtSource\Blender\Scripts\generate_hero_assets.py
          ArtSource\Blender\Scripts\generate_hero_tabletop.py
          ArtSource\Blender\Scripts\generate_reference_pass.py
          ArtSource\Blender\Scripts\generate_approved_target_pass.py
          ArtSource\Blender\Scripts\generate_quality_assets.py
          ArtSource\Blender\Scripts\generate_realistic_target_pass.py
          ArtSource\Blender\Scripts\generate_reference_quality_v2.py
          ArtSource\Blender\Scripts\generate_opponent_hero_v3.py
          ArtSource\Blender\Scripts\generate_opponent_hero_v4.py
          ArtSource\Blender\Scripts\generate_cinematic_material_pass.py
          ArtSource\Blender\Scripts\build_model_review_workspace.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\CastleCards.csproj

      - name: Build
        run: dotnet build .\CastleCards.csproj --configuration Release --no-restore
